<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syeda Momna Art Gallery - CodeAlpha Task 3</title>
<style>
    * {margin: 0; padding: 0; box-sizing: border-box;}
  body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    /* Animated Gradient Background */
    background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    padding: 40px 20px; color: white;
  }
  @keyframes gradientBG {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
  }
  h1 {text-align: center; font-size: 2.5rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);}
.subtitle {text-align: center; margin-bottom: 30px; font-size: 1.1rem;}
.gallery {
    display: grid; 
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px; max-width: 1200px; margin: auto;
  }
  /* Responsive Design */
  @media (max-width: 768px) {
 .gallery {grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));}
    h1 {font-size: 2rem;}
  }
  @media (max-width: 480px) {
 .gallery {grid-template-columns: 1fr;}
  }
.gallery-item {
    border-radius: 15px; overflow: hidden; 
    box-shadow: 0 8px 20px rgba(0,0,0,0.3); 
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    transition: transform 0.4s ease, box-shadow 0.4s ease;
    cursor: pointer;
  }
  /* Hover Effects */
.gallery-item:hover {
    transform: scale(1.05) translateY(-10px);
    box-shadow: 0 15px 30px rgba(0,0,0,0.5);
  }
.gallery-item img {
    width: 100%; height: 250px; object-fit: cover; display: block;
    transition: filter 0.3s ease;
  }
.gallery-item:hover img {filter: brightness(1.1);}
.view-btn {
    width: 100%; padding: 12px; border: none;
    background: linear-gradient(90deg, #ff6b6b, #feca57);
    color: white; font-weight: bold; cursor: pointer;
    transition: 0.3s; font-size: 1rem;
  }
.view-btn:hover {background: linear-gradient(90deg, #feca57, #ff6b6b);}
.footer {text-align: center; margin-top: 40px; font-size: 0.9rem;}
/* Lightbox with JS navigation */
.lightbox {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.95); justify-content: center; align-items: center;
    z-index: 1000; flex-direction: column;
  }
.lightbox.active {display: flex;}
.lightbox img {max-width: 90%; max-height: 80%; border-radius: 10px; margin-bottom: 20px;}
.lightbox-nav {display: flex; gap: 20px;}
.nav-btn {
    padding: 10px 20px; background: white; color: black; border: none;
    border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem;
  }
.nav-btn:hover {background: #feca57;}
.close {position: absolute; top: 20px; right: 40px; color: white; font-size: 40px; text-decoration: none; cursor: pointer;}
</style>
</head>
<body>

<h1>Momna's  Art Gallery 🎨</h1>
<p class="subtitle">CodeAlpha Internship Task 3</p>

<div class="gallery">
  <div class="gallery-item" onclick="openLightbox(0)">
    <img src="0c00a8ea6cb6251be58498662fbcee22.jpg" alt="Art 1">
    <button class="view-btn">View Full Size</button>
  </div>
  <div class="gallery-item" onclick="openLightbox(1)">
    <img src="0e7cbdb88374ec0b7070cd9cc2d96109.jpg" alt="Art 2">
    <button class="view-btn">View Full Size</button>
  </div>
  <div class="gallery-item" onclick="openLightbox(2)">
    <img src="40da2725abe05132a763149c4bc7d370.jpg" alt="Art 3">
    <button class="view-btn">View Full Size</button>
  </div>
  <div class="gallery-item" onclick="openLightbox(3)">
    <img src="899d6df49f773e62732f267962543a2b.webp.jpg" alt="Art 4">
    <button class="view-btn">View Full Size</button>
  </div>
  <div class="gallery-item" onclick="openLightbox(4)">
    <img src="8572c31dd72230a9b26af07894e4161f.jpg" alt="Art 5">
    <button class="view-btn">View Full Size</button>
  </div>
  <div class="gallery-item" onclick="openLightbox(5)">
    <img src="5818478988e779c0157d0f335fd43afa.jpg" alt="Art 6">
    <button class="view-btn">View Full Size</button>
  </div>
  <div class="gallery-item" onclick="openLightbox(6)">
    <img src="b3967b23464c50920d463b08c3d02ac1.webp.jpg" alt="Art 7">
    <button class="view-btn">View Full Size</button>
  </div>
  <div class="gallery-item" onclick="openLightbox(7)">
    <img src="f8010798ffdd4c077ea404b8aaeb3159_1.jpg" alt="Art 8">
    <button class="view-btn">View Full Size</button>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox">
  <span class="close" onclick="closeLightbox()">&times;</span>
  <img id="lightbox-img" src="">
  <div class="lightbox-nav">
    <button class="nav-btn" onclick="prevImage()">← Previous</button>
    <button class="nav-btn" onclick="nextImage()">Next →</button>
  </div>
</div>

<div class="footer">
  <p>Developed by Syeda Momna | CodeAlpha Web Development Internship</p>
</div>

<script>
  const images = [
    "0c00a8ea6cb6251be58498662fbcee22.jpg",
    "0e7cbdb88374ec0b7070cd9cc2d96109.jpg",
    "40da2725abe05132a763149c4bc7d370.jpg",
    "899d6df49f773e62732f267962543a2b.webp.jpg",
    "8572c31dd72230a9b26af07894e4161f.jpg",
    "5818478988e779c0157d0f335fd43afa.jpg",
    "b3967b23464c50920d463b08c3d02ac1.webp.jpg",
    "f8010798ffdd4c077ea404b8aaeb3159_1.jpg"
  ];
  let currentIndex = 0;

  function openLightbox(index) {
    currentIndex = index;
    document.getElementById('lightbox-img').src = images[currentIndex];
    document.getElementById('lightbox').classList.add('active');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % images.length;
    document.getElementById('lightbox-img').src = images[currentIndex];
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    document.getElementById('lightbox-img').src = images[currentIndex];
  }

  document.addEventListener('keydown', (e) => {
    if(document.getElementById('lightbox').classList.contains('active')) {
      if(e.key === 'ArrowRight') nextImage();
      if(e.key === 'ArrowLeft') prevImage();
      if(e.key === 'Escape') closeLightbox();
    }
  });
</script>
</body>
</html>
